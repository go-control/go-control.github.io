baseURL = 'https://go-control.github.io/'
locale  = 'en-us'
title   = 'go-control'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html, and the shared design (styles, theme toggle, fork ribbon,
# icons) imported as the Hugo module github.com/go-fleettools/landingkit,
# pinned in go.mod.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-control: control systems and DAE solvers in pure Go (CGO=0). Planned, wave 3 of the go-scikit roadmap: no library exists yet."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-control.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the scope of the organisation, the plan and one page per planned package. <a href=\"https://github.com/go-control/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-control/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The planned packages. None exists: each statement is from the roadmap's
# bibliography (go-scikit/roadmap, bib/systems-units-formats-visualization.md).
[[params.packages]]
  name  = "lti"
  kind  = "planned (wave 3)"
  blurb = "Transfer-function, zero-pole-gain, state-space and frequency-response models; series, parallel and feedback; poles, zeros, time and frequency responses and stability margins. Validated against python-control and SciPy."
[[params.packages]]
  name  = "design"
  kind  = "planned (wave 3)"
  blurb = "Riccati and Lyapunov equations, LQR and LQG, Kalman gain, pole placement and discretisation (<code>c2d</code>). Validated against SLICOT's routines and benchmark collections."
[[params.packages]]
  name  = "dae"
  kind  = "planned (wave 3)"
  blurb = "An IDA-type variable-order BDF solver for differential-algebraic equations, with consistent initial conditions and events. Validated against the Bari IVP test set and SUNDIALS IDA. Its placement relative to go-numerics/integrate is still open."
[[params.packages]]
  name  = "model"
  kind  = "planned (wave 4)"
  blurb = "MapleSim-style symbolic acausal modelling: equation assembly, Pantelides index reduction, block ordering and emission of Go through go-symbolic's <code>codegen</code>. Validated on Modelica Standard Library examples."

# The cards of #checks and their count come from this list. Each statement is
# a measure the roadmap says the work will be held to; none has been run.
[[params.checks]]
  name = "Riccati and Lyapunov"
  what = "Relative residual below 1e3·n·eps, a symmetric solution to one ulp and closed-loop poles in the left half-plane, over the SLICOT benchmark collections."
[[params.checks]]
  name = "Frequency response and `expm`"
  what = "Complex relative error per point against python-control, and norm-wise error of `expm` and `c2d` against a high-precision reference."
[[params.checks]]
  name = "DAE"
  what = "Final-time error against the Bari test set at a stated tolerance, constraint drift, steps, Newton iterations and event times to 1e-10."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 6.14:1, bright on the dark background 8.07:1.
  base = "#0e6b7d"
  deep = "#09414c"
  bright = "#3fb6cc"
  shadow = "rgba(14,107,125,.7)"
  glow = "rgba(14,107,125,.6)"
  wash = "rgba(14,107,125,.10)"
  washDeep = "rgba(9,65,76,.06)"
  chipBg = "#e8f6f9"
  chipBorder = "#c5e9f0"
  chipFg = "#09414c"
  chipBgDark = "rgba(63,182,204,.14)"
  chipBorderDark = "rgba(63,182,204,.32)"
  chipFgDark = "#95d7e3"
  statsEnd = "#d1edf3"
  bandText = "#e0f3f7"
